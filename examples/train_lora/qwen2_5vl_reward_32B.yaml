### model
model_name_or_path: /mnt/bn/evalonly/model/Qwen2.5-VL-7B-Instruct
reward_model: /mnt/bn/evalonly/LLaMA-Factory/save/A_0606_product_reward/32Blora_train/checkpoint-81-hf
reward_model_type: full
image_max_pixels: 50172
video_max_pixels: 16384
trust_remote_code: true

### method
stage: ppo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]
flash_attn: fa2


### dataset
dataset:  product_rm
template: qwen2_vl
cutoff_len: 16000
#max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2_5vl-7b/RM-lora-32B-5
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### generate
max_new_tokens: 8
top_k: 0
top_p: 0.9


